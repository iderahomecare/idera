<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDERA Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">I</span><span>IDERA<small>ADMINISTRATION</small></span></a><a href="index.html">View public website</a></header><main class="section"><div class="section-kicker">PRIVATE ADMINISTRATION</div><h2>IDERA Dashboard</h2><p>Sign in with the administrator account authorised for IDERA.</p><section id="login-panel"><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p id="login-status" role="status"></p></form></section><section id="dashboard" hidden><div class="actions"><button id="logout" class="btn btn-light">Sign out</button></div><h3>Gallery Manager</h3><form id="upload-form"><label>Photo title<input name="title" maxlength="120" required></label><label>Description<input name="description" maxlength="300"></label><label>Choose photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><label><input name="published" type="checkbox" checked> Publish on public website</label><button class="btn">Upload photo</button><p id="upload-status" role="status"></p></form><div id="admin-gallery" class="gallery-grid"></div><h3>Enquiries</h3><div id="enquiries">No enquiries loaded.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
